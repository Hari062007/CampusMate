    <circle cx="100" cy="290" r="10" fill="#10b981" />
    <rect x="125" y="285" width="170" height="10" rx="5" fill="#4f46e5" />
    
    <rect x="70" y="325" width="260" height="40" rx="12" fill="#ffffff" opacity="0.8" />
    <circle cx="100" cy="345" r="10" fill="#3b82f6" />
